<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Rima Karsa - Make It a Rhythm</title>
    <meta name="description" content="Aplikasi pelacak kebiasaan harian modern untuk ponsel (PWA) dengan notifikasi pengingat aktivitas in-app dan push sistem." />
    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kebiasaan" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta property="og:title" content="Pelacak Kebiasaan" />
    <meta property="og:description" content="Aplikasi pelacak kebiasaan harian modern untuk ponsel (PWA) dengan notifikasi pengingat aktivitas in-app dan push sistem." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root">
      <style>
        .splash-screen {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          background-color: #f8f9fa;
          font-family: system-ui, -apple-system, sans-serif;
        }
        .splash-spinner {
          width: 40px;
          height: 40px;
          border: 4px solid #10b981;
          border-top-color: transparent;
          border-radius: 50%;
          animation: splash-spin 1s linear infinite;
          margin-bottom: 20px;
        }
        @keyframes splash-spin {
          100% { transform: rotate(360deg); }
        }
        @media (prefers-color-scheme: dark) {
          .splash-screen { background-color: #141413; color: #f4f4f1; }
        }
      </style>
      <div class="splash-screen">
        <div class="splash-spinner"></div>
        <h2 style="font-weight: 700; margin: 0; color: #10b981; letter-spacing: -0.5px;">Rima Karsa</h2>
        <p style="font-size: 11px; letter-spacing: 0.18em; font-weight: 700; color: #10b981; text-transform: uppercase; margin-top: 6px;">Make It a Rhythm</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
